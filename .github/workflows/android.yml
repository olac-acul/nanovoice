name: android
on:
  push:
  pull_request:
# The token can only read the repository.
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # The Android SDK is preinstalled on the runner image; Gradle needs to be told where.
      - run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - run: ./gradlew --no-daemon test lint
